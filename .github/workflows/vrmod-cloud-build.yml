name: VR mod cloud build

on:
  push:
    branches:
      - vrmod-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Compile and test on Windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: cmake -S . -B build-current -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build-current --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build-current -C Release --output-on-failure

      - name: Upload compiled binaries and addon files
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: A3VR-cloud-build-${{ github.sha }}
          path: |
            build-current/Release/*.dll
            build-current/Release/*.exe
            addons/**
            a3vr-motion.ini
            a3vr-runtime.example.ini
            mod.cpp
          if-no-files-found: error
          retention-days: 14
